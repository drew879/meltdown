<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffe191" />
    <title>Meltdown: four looks</title>
    <script type="module">
      import '../src/ui/theme.css';
    </script>
    <style>
      body { padding: calc(env(safe-area-inset-top, 0px) + 18px) 14px calc(env(safe-area-inset-bottom, 0px) + 40px); }
      header { max-width: 1100px; margin: 0 auto 18px; }
      header h1 { margin: 0 0 6px; font: 400 34px/1.1 var(--display); }
      header p { margin: 0; font-size: 17px; line-height: 1.4; font-weight: 600; opacity: 0.9; }
      main { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
      figure { margin: 0; overflow: hidden; }
      figure a { display: block; }
      figure img { display: block; width: 100%; height: auto; border-bottom: var(--line) solid var(--ink); }
      figcaption { padding: 9px 12px 10px; }
      figcaption b { display: block; font: 400 22px/1.15 var(--display); }
      figcaption span { font-size: 15px; line-height: 1.35; font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <h1>Four looks, one scene</h1>
      <p>The same title screen in four styles. Tap a picture to see it full size. These are mock-ups for choosing a look, not finished art.</p>
    </header>
    <main>
      <figure class="sticker">
        <a href="../art/concepts/round-1/a-ink-cartoon.jpg"><img src="../art/concepts/round-1/a-ink-cartoon.jpg" alt="Look A: an ink-outlined cartoon snowman in a thawing backyard under a smug sun" /></a>
        <figcaption><b>A. Ink cartoon</b><span>Outlines and flat colour.</span></figcaption>
      </figure>
      <figure class="sticker">
        <a href="../art/concepts/round-1/b-screen-print.jpg"><img src="../art/concepts/round-1/b-screen-print.jpg" alt="Look B: a retro screen-print poster of the same scene with a red title and no outlines" /></a>
        <figcaption><b>B. Screen-print poster</b><span>Flat shapes, five colours, printed texture.</span></figcaption>
      </figure>
      <figure class="sticker">
        <a href="../art/concepts/round-1/c-cut-paper.jpg"><img src="../art/concepts/round-1/c-cut-paper.jpg" alt="Look C: the same scene built from layered cut paper with soft shadows" /></a>
        <figcaption><b>C. Cut paper</b><span>Layered paper with real shadows.</span></figcaption>
      </figure>
      <figure class="sticker">
        <a href="../art/concepts/round-1/d-clay.jpg"><img src="../art/concepts/round-1/d-clay.jpg" alt="Look D: the same scene sculpted in clay like a stop-motion film" /></a>
        <figcaption><b>D. Clay stop-motion</b><span>Sculpted models on a miniature set.</span></figcaption>
      </figure>
    </main>
  </body>
</html>
