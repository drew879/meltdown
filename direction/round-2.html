<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffe191" />
    <title>Meltdown: cut paper, round 2</title>
    <script type="module">
      import '../src/ui/theme.css';
    </script>
    <style>
      body { padding: calc(env(safe-area-inset-top, 0px) + 18px) 14px calc(env(safe-area-inset-bottom, 0px) + 40px); }
      header, section { max-width: 1100px; margin: 0 auto 18px; }
      header h1 { margin: 0 0 6px; font: 400 34px/1.1 var(--display); }
      header p { margin: 0; font-size: 17px; line-height: 1.4; font-weight: 600; }
      h2 { margin: 26px 0 10px; font: 400 24px/1.15 var(--display); }
      .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-items: start; }
      .grid.wide { grid-template-columns: 1fr; }
      figure { margin: 0; overflow: hidden; }
      figure a { display: block; }
      figure img { display: block; width: 100%; height: auto; border-bottom: var(--line) solid var(--ink); }
      figcaption { padding: 9px 12px 10px; }
      figcaption b { display: block; font: 400 21px/1.15 var(--display); }
      figcaption span { font-size: 15px; line-height: 1.35; font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <h1>Cut paper, round 2</h1>
      <p>The look you picked, on the screens the game needs. Tap a picture to see it full size. These are mock-ups, so the names and the puzzle are made up.</p>
    </header>
    <section>
      <h2>The play screen, two ways</h2>
      <div class="grid">
        <figure class="sticker">
          <a href="../art/concepts/round-2/1-play-garden-sign.jpg"><img src="../art/concepts/round-2/1-play-garden-sign.jpg" alt="Play screen 1: the answer on a wooden garden sign, square keys in a brown paper tray" /></a>
          <figcaption><b>1. Garden sign</b><span>Answer on a wooden sign. Square keys in a brown paper tray.</span></figcaption>
        </figure>
        <figure class="sticker">
          <a href="../art/concepts/round-2/2-play-pegged-banner.jpg"><img src="../art/concepts/round-2/2-play-pegged-banner.jpg" alt="Play screen 2: the answer on a paper banner pegged to a string, round keys on a snowbank" /></a>
          <figcaption><b>2. Pegged banner</b><span>Answer on a paper banner on a line. Round keys on a snowbank.</span></figcaption>
        </figure>
        <figure class="sticker">
          <a href="../art/concepts/round-2/6-lost-round.jpg"><img src="../art/concepts/round-2/6-lost-round.jpg" alt="Lost round: a puddle with the hat, carrot, scarf and two eyes, under the word Sploosh" /></a>
          <figcaption><b>6. A lost round</b><span>The puddle gag, the answer shown, and the next button.</span></figcaption>
        </figure>
      </div>
    </section>
    <section>
      <h2>The snowman and the sun</h2>
      <div class="grid wide">
        <figure class="sticker">
          <a href="../art/concepts/round-2/3-melt-stages.jpg"><img src="../art/concepts/round-2/3-melt-stages.jpg" alt="Six stages of the snowman melting, from proud to a puddle with a hat" /></a>
          <figcaption><b>3. Melting, in six stages</b><span>From proud to puddle.</span></figcaption>
        </figure>
        <figure class="sticker">
          <a href="../art/concepts/round-2/4-expressions.jpg"><img src="../art/concepts/round-2/4-expressions.jpg" alt="Four moods of the sun above four moods of the snowman" /></a>
          <figcaption><b>4. Moods</b><span>The sun: smug, gleeful, annoyed, clouded over. The snowman: ham, nervous, panicking, cheering.</span></figcaption>
        </figure>
      </div>
    </section>
    <section>
      <h2>Icon ideas</h2>
      <div class="grid wide" style="max-width: 640px">
        <figure class="sticker">
          <a href="../art/concepts/round-2/5-app-icons.jpg"><img src="../art/concepts/round-2/5-app-icons.jpg" alt="Four app icon ideas: nervous face, sun peeking over the hat, hat on a puddle, snowman with sun rays" /></a>
          <figcaption><b>5. Four icons</b><span>Top left: nervous face. Top right: sun over the hat. Bottom left: the puddle. Bottom right: snowman and rays.</span></figcaption>
        </figure>
      </div>
    </section>
  </body>
</html>
